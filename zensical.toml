# Zensical site config. Preview with `uv run zensical serve`; build with `uv run zensical build`.
# The sidebar below must list every page in course/; `uv run tools/check_course.py` enforces this.

[project]
site_name = "Data Engineering System Design"
site_description = "A self-study course for the data engineering system design interview."
docs_dir = "course"
site_dir = "site"
use_directory_urls = false                  # links end in .html so the built site also works opened from disk (file://)
